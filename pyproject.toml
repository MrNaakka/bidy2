[project]
name = "framehunt"
version = "0.1.0"
description = "FrameHunt: an RL environment for active video sampling under a pixel budget"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.20,<2",
  "pillow>=11",
  "numpy>=2",
  "av>=14",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
