[project]
name = "framehunt"
version = "0.1.0"
description = "FrameHunt: an RL environment for active video sampling under a pixel budget"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.20,<2",
  "pillow>=11",
  "numpy>=2",
  "av>=14",
  "httpx>=0.27",
  "stretchable>=1.1.8",
  "sympy>=1.13",
]

[dependency-groups]
dev = [
    "harbor>=0.25.0 ; python_full_version >= '3.12'",
    "pytest>=8",
]
render = [
    "manim>=0.22.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
