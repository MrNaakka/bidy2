services:
  main:
    depends_on:
      probe-mcp:
        condition: service_healthy
  probe-mcp:
    build:
      context: ./mcp
    environment:
      VERIFY_TOKEN: step0-verify-7f3a
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8000/_verify"]
      interval: 2s
      retries: 30
